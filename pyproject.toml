[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sdflens"
dynamic = ["version"]
description = "3D and 2D viewer for ISO 25178-71 SDF and ISO 25178-72 x3p surface data files"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Ascher", email = "thomas.ascher@gmx.at" }]
keywords = ["sdf", "x3p", "iso-25178", "surface-texture", "metrology", "viewer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "PySide6>=6.10",
    "sdfio>=1.3.0",
    # Temporary: a git dependency until x3pio is released on PyPI.
    "x3pio @ git+https://github.com/aschet/x3pio.git",
]

[project.urls]
Source = "https://github.com/aschet/sdflens"

[project.gui-scripts]
sdflens = "sdflens.app:main"

[dependency-groups]
dev = [
    "bandit[toml]>=1.7",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "reuse>=5.0",
    "ruff>=0.5",
    "uv>=0.9",
    "vulture>=2.11",
]
packaging = [
    "editables>=0.5",
    "hatchling>=1.24",
    "pyinstaller>=6.16",
    "cyclonedx-python-lib[json-validation]>=11",
]

[tool.hatch.metadata]
allow-direct-references = true  # for the temporary x3pio git dependency

[tool.hatch.version]
path = "src/sdflens/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sdflens"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/LICENSES",
    "/REUSE.toml",
    "/.pre-commit-config.yaml",
]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["tests"]
addopts = "--doctest-modules --strict-markers --strict-config --import-mode=importlib"
testpaths = ["tests", "src"]

[tool.coverage.report]
fail_under = 75

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "D", "NPY", "PT", "ERA", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "S101"]
# Qt event handlers and slots keep their camelCase overrides.
"src/sdflens/*" = ["N802"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
files = ["src", "tests"]
strict = true

[tool.vulture]
paths = ["src"]
min_confidence = 80

[tool.bandit]
exclude_dirs = ["tests"]
