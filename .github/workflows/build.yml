name: Build packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Build the app and the installer
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: sdflens-installer
          path: |
            build/installer/*.msi
            build/installer/*.cdx.json
      - name: Attach the installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/installer/*.msi
            build/installer/*.cdx.json

  linux-appimage:
    # The oldest runner image: the AppImage needs the glibc of the system it is built on or newer.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install the libraries that Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Install the locked packages and the app
        run: |
          python -m pip install -r pylock.build.toml
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Download appimagetool
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c -
          chmod +x appimagetool
      - name: Build the app and the AppImage
        # appimagetool is itself an AppImage, and the runner has no FUSE.
        run: APPIMAGETOOL="$PWD/appimagetool" APPIMAGE_EXTRACT_AND_RUN=1 ./packaging/build_linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: sdflens-appimage
          path: |
            build/appimage/*.AppImage
            build/appimage/*.cdx.json
      - name: Attach the AppImage to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/appimage/*.AppImage
            build/appimage/*.cdx.json
