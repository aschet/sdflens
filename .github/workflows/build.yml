name: Build installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build the app and the installer
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: sdflens-installer
          path: |
            build/installer/*.msi
            build/installer/*.cdx.json
      - name: Attach the installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/installer/*.msi
            build/installer/*.cdx.json
